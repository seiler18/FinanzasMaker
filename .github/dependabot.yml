# Dependabot: avisa de dependencias vulnerables o viejas y abre el PR que las
# actualiza. Cada PR manda un correo, por eso las menores y de parche van juntas
# en un solo PR por semana; las mayores van cada una por su lado porque son las
# que rompen.
#
# Las actualizaciones de seguridad (las que dispara una alerta) no dependen de
# este archivo: se encienden en Settings → Code security. Este archivo gobierna
# las de versión. Los workflows fijan las acciones por SHA con el comentario de
# la versión; Dependabot actualiza las dos cosas a la vez, no quitar el comentario.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # Las pruebas de `test:base` imitan a Supabase, que corre Postgres 17: con
      # el embedded-postgres de otra mayor probarían contra una base distinta a la
      # de producción. Se sube cuando Supabase suba.
      - dependency-name: embedded-postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
