# Publica el sitio en GitHub Pages en cada push a main.
# `npm run build` incluye `npm run check`: si algo falla, no se publica.
#
# Endurecido tras la auditoría (SECURITY.md, L5):
# - Dos trabajos: el que construye NO tiene ningún permiso de escritura; el
#   que publica solo puede escribir en Pages (no en el repositorio).
# - `npm ci --ignore-scripts`: ningún script de instalación de una dependencia
#   se ejecuta en el runner (vía clásica de robo de tokens en CI).
# - Acciones fijadas por SHA, no por etiqueta movible.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # La única excepción a --ignore-scripts, con nombre: el Postgres
      # desechable de `npm run test:base` trae sus binarios en el paquete, pero
      # npm no publica enlaces simbólicos y su postinstall
      # (scripts/hydrate-symlinks.js, revisado: solo recrea los enlaces de
      # native/pg-symlinks.json) los rehace. Sin él, Postgres no arranca en Linux.
      - run: npm rebuild @embedded-postgres/linux-x64
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
